[project]
name = "sentiment-analysis-reviews-of-scientific-papers"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Harveen Kaur", email = "harveenkaur282@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "docker>=7.2.0",
    "matplotlib>=3.11.2",
    "nltk>=3.10.3",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "scipy>=1.18.1",
    "seaborn>=0.13.2",
    "sentence-transformers>=6.1.0",
    "streamlit>=1.66.0",
    "tqdm>=4.70.1",
]

[project.scripts]
sentiment-analysis-reviews-of-scientific-papers = "sentiment_analysis_reviews_of_scientific_papers:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
